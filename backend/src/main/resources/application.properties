spring.application.name=SAPR
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========== DATABASE ==========
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/sapr_db
spring.datasource.username=user_sapr
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========== JWT ==========
jwt.secret=${JWT_SECRET:sapr_jwt_2026_super_secret_key_change_in_prod!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== UPLOAD ==========
app.upload.dir=${UPLOAD_DIR:uploads/products}

# ========== CORS ==========
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ========== APP URL ==========
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.security.password-reset-expiration-minutes=${PASSWORD_RESET_EXP_MINUTES:30}
app.security.main-admin-email=${MAIN_ADMIN_EMAIL:admin@sapr.com}

# ========== MAIL ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========== SWAGGER ==========
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ========== LOGGING ==========
logging.level.org.hibernate=ERROR
spring.jackson.serialization.fail-on-empty-beans=false