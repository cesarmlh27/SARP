spring.application.name=SAPR
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ========== DATABASE ==========
spring.jpa.database=postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ========== MIGRATIONS ==========
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ========== JWT ==========
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== UPLOAD ==========
app.upload.dir=${UPLOAD_DIR:uploads/products}

# ========== CORS ==========
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ========== APP URL ==========
app.frontend.url=${APP_FRONTEND_URL}
app.security.password-reset-expiration-minutes=${PASSWORD_RESET_EXP_MINUTES:30}
app.security.main-admin-email=${MAIN_ADMIN_EMAIL:admin@sapr.com}
app.security.main-admin-password=${MAIN_ADMIN_PASSWORD:Admin1234!}

# ========== MAIL ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========== SWAGGER ==========
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ========== LOGGING ==========
logging.level.org.hibernate=ERROR
spring.jackson.serialization.fail-on-empty-beans=false