# ========== DEVELOPMENT ==========
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sapr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_sapr}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.sapr=DEBUG
logging.level.org.hibernate.SQL=DEBUG

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Flyway disabled in dev to preserve current iterative workflow based on ddl-auto=update.
spring.flyway.enabled=false
